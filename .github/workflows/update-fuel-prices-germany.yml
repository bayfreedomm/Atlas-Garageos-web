name: Update fuel prices (Germany, manual only)

# MANUAL TRIGGER ONLY — there is deliberately no `schedule:` block here.
#
# Tankerkönig is a donation-funded, per-station service whose radius endpoint is limited to
# one request per minute; it is not a bulk national feed and should not be polled on a timer
# by a static site. Atlas also has no backend that could fetch it on demand (output:
# 'static', no adapter, no API routes), so there is no honest "live" path either. Until a
# data source suited to automatic German national reporting is chosen, Germany is refreshed
# only when a human runs this workflow from the Actions tab, and the site shows its real
# state in the meantime: `pending` if it has never been verified, `stale`/last-verified if it
# was verified once and has not been refreshed since.
#
# What this produces is an Atlas monitored sample of selected city stations — it is never
# labelled a German national average anywhere.

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-fuel-data-rolling-pr
  cancel-in-progress: false

jobs:
  update-germany-sample:
    name: Refresh Germany monitored sample
    runs-on: ubuntu-latest
    # The Tankerkönig radius endpoint allows 1 request/minute, and the script spaces its 5
    # city requests 60s apart, so this job deliberately takes ~5 minutes.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Restore history backup from the fuel-data branch
        run: |
          set -euo pipefail
          echo '{"es":[],"de":[],"us":[]}' > /tmp/history-backup.json
          if git ls-remote --exit-code origin refs/heads/fuel-data >/dev/null; then
            git fetch --no-tags origin "+refs/heads/fuel-data:refs/remotes/origin/fuel-data"
            git show origin/fuel-data:fuel-price-history.json > /tmp/history-backup.json || echo '{"es":[],"de":[],"us":[]}' > /tmp/history-backup.json
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Germany monitored sample
        # The API key is read only here, by a Node script running in CI, via process.env.
        # It is never written into the built site and never printed by the script.
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: node scripts/update-fuel-prices.mjs --providers=de --merge-history=/tmp/history-backup.json

      - name: Publish to the default branch and the fuel-data backup branch
        # Owner decision (2026-10-09): fuel data publishes directly, without a review PR, so
        # prices and history reach the site on every run with no manual merge.
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MESSAGE: "chore: refresh Germany monitored fuel sample (manual run)"
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/fuel-prices.json src/data/fuel-price-history.json; then
            echo "No price change — nothing to commit."
            exit 0
          fi
          git config user.name "atlas-garageos-bot"
          git config user.email "actions@users.noreply.github.com"
          cp src/data/fuel-prices.json /tmp/fuel-prices.json
          cp src/data/fuel-price-history.json /tmp/fuel-price-history.json
          git add src/data/fuel-prices.json src/data/fuel-price-history.json
          git commit -m "$COMMIT_MESSAGE"
          # If someone pushed meanwhile, start again from their commit and re-apply only the two
          # data files (history is merged, never replaced).
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$BASE_BRANCH"; then break; fi
            if [ "$attempt" = 3 ]; then echo "Could not publish after 3 attempts"; exit 1; fi
            git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
            git reset --hard "origin/$BASE_BRANCH"
            node scripts/merge-fuel-history.mjs src/data/fuel-price-history.json /tmp/fuel-price-history.json
            cp /tmp/fuel-prices.json src/data/fuel-prices.json
            git add src/data/fuel-prices.json src/data/fuel-price-history.json
            git commit -m "$COMMIT_MESSAGE" || exit 0
          done
          # Backup copy on a branch nobody edits by hand. If a manual upload overwrites the history
          # file on the default branch, the next run merges it back from here.
          tmp="$(mktemp -d)"
          if git ls-remote --exit-code origin refs/heads/fuel-data >/dev/null; then
            git fetch --no-tags origin "+refs/heads/fuel-data:refs/remotes/origin/fuel-data"
            git worktree add -B fuel-data "$tmp" origin/fuel-data
          else
            git worktree add --detach "$tmp"
            git -C "$tmp" switch --orphan fuel-data
          fi
          cp /tmp/fuel-prices.json "$tmp/fuel-prices.json"
          cp src/data/fuel-price-history.json "$tmp/fuel-price-history.json"
          git -C "$tmp" add fuel-prices.json fuel-price-history.json
          git -C "$tmp" commit -m "$COMMIT_MESSAGE" || true
          git -C "$tmp" push origin "HEAD:refs/heads/fuel-data"
