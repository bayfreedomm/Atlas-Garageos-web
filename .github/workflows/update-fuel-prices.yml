name: Update fuel prices (Spain + US)

# Scheduled automation covers only the two markets whose sources are genuinely meant to be
# polled automatically: Spain's official Ministerio open dataset and the EIA's weekly US
# retail survey. Germany is NOT here on purpose — Tankerkönig is a per-station community
# service, not a bulk national feed, so it is refreshed only by a deliberate manual run
# (see update-fuel-prices-germany.yml). The Tankerkönig secret is therefore not exposed to
# this workflow at all.

"on":
  schedule:
    # Runs 4 times a day, well inside both sources' fair-use limits regardless of site
    # traffic, because visitors never call these APIs directly — only this job does. UTC.
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test it

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Both scheduled and manual-Germany jobs publish through the same rolling branch.
  # One repository-wide group keeps their lease snapshots from racing each other.
  group: ${{ github.repository }}-fuel-data-rolling-pr
  cancel-in-progress: false

jobs:
  update-scheduled-markets:
    name: Refresh Spain + US
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare rolling fuel-data branch
        id: fuel-branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          FUEL_BRANCH: automation/fuel-data
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          remote_sha=""
          if remote_ref="$(git ls-remote --heads origin "refs/heads/$FUEL_BRANCH")" && [ -n "$remote_ref" ]; then
            remote_sha="${remote_ref%%[[:space:]]*}"
            git fetch --no-tags origin "+refs/heads/$FUEL_BRANCH:refs/remotes/origin/$FUEL_BRANCH"
          fi
          printf 'remote_sha=%s\n' "$remote_sha" >> "$GITHUB_OUTPUT"
          # The automation branch is a disposable publication branch, not a development
          # branch. Every run starts from the current default branch and recreates only the
          # current verified fuel-data delta; old mutable JSON commits are never replayed.
          git switch --force-create "$FUEL_BRANCH" "origin/$BASE_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Spain and US fuel prices
        # Germany is not selected, so it is carried forward untouched: no request to
        # Tankerkönig, no change to its status/timestamps, and no history point for it.
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/update-fuel-prices.mjs --providers=es,us

      - name: Publish update through rolling pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          FUEL_BRANCH: automation/fuel-data
          EXPECTED_REMOTE_SHA: ${{ steps.fuel-branch.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/fuel-prices.json src/data/fuel-price-history.json; then
            echo "No price change — nothing to commit."
            exit 0
          fi
          git config user.name "atlas-garageos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/fuel-prices.json src/data/fuel-price-history.json
          git commit -m "chore: update Spain and US fuel prices"
          # An explicit lease pins the push to the remote SHA observed before the fetch.
          # An empty expected SHA means "create only if the branch still does not exist".
          git push --force-with-lease="refs/heads/$FUEL_BRANCH:$EXPECTED_REMOTE_SHA" \
            --set-upstream origin "HEAD:refs/heads/$FUEL_BRANCH"
          pr_number="$(gh pr list --base "$BASE_BRANCH" --head "$FUEL_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$FUEL_BRANCH" \
              --title "chore: refresh fuel market data" \
              --body "Automated fuel-data refresh. This rolling PR keeps mutable snapshots and history out of direct development-branch commits; merge it after normal checks pass."
          else
            echo "Updated rolling fuel PR #$pr_number."
          fi
