name: Update fuel prices (Spain + US)

# Scheduled automation covers only the two markets whose sources are genuinely meant to be
# polled automatically: Spain's official Ministerio open dataset and the EIA's weekly US
# retail survey. Germany is NOT here on purpose — Tankerkönig is a per-station community
# service, not a bulk national feed, so it is refreshed only by a deliberate manual run
# (see update-fuel-prices-germany.yml). The Tankerkönig secret is therefore not exposed to
# this workflow at all.

"on":
  schedule:
    # Runs 4 times a day, well inside both sources' fair-use limits regardless of site
    # traffic, because visitors never call these APIs directly — only this job does. UTC.
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill up to 26 weeks of history'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Both scheduled and manual-Germany jobs publish to the same branches; one group keeps
  # them from racing each other.
  group: ${{ github.repository }}-fuel-data-rolling-pr
  cancel-in-progress: false

jobs:
  update-scheduled-markets:
    name: Refresh Spain + US
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Restore history backup from the fuel-data branch
        run: |
          set -euo pipefail
          echo '{"es":[],"de":[],"us":[]}' > /tmp/history-backup.json
          if git ls-remote --exit-code --heads origin fuel-data >/dev/null; then
            git fetch --no-tags origin "+refs/heads/fuel-data:refs/remotes/origin/fuel-data"
            git show origin/fuel-data:fuel-price-history.json > /tmp/history-backup.json || echo '{"es":[],"de":[],"us":[]}' > /tmp/history-backup.json
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Spain and US fuel prices
        # Germany is not selected, so it is carried forward untouched: no request to
        # Tankerkönig, no change to its status/timestamps, and no history point for it.
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        # Keep a valid country's verified snapshot publishable even when the other
        # provider fails. The final health gate below still marks the run failed.
        continue-on-error: true
        run: node scripts/update-fuel-prices.mjs --providers=es,us --merge-history=/tmp/history-backup.json ${{ inputs.backfill && '--backfill' || '' }}

      - name: Publish to the default branch and the fuel-data backup branch
        # Owner decision (2026-10-09): fuel data publishes directly, without a review PR, so
        # prices and history reach the site on every run with no manual merge.
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MESSAGE: "chore: update Spain and US fuel prices"
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/fuel-prices.json src/data/fuel-price-history.json; then
            echo "No price change — nothing to commit."
            exit 0
          fi
          git config user.name "atlas-garageos-bot"
          git config user.email "actions@users.noreply.github.com"
          cp src/data/fuel-prices.json /tmp/fuel-prices.json
          cp src/data/fuel-price-history.json /tmp/fuel-price-history.json
          git add src/data/fuel-prices.json src/data/fuel-price-history.json
          git commit -m "$COMMIT_MESSAGE"
          # If someone pushed meanwhile, start again from their commit and re-apply only the two
          # data files (history is merged, never replaced).
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$BASE_BRANCH"; then break; fi
            if [ "$attempt" = 3 ]; then echo "Could not publish after 3 attempts"; exit 1; fi
            git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
            git reset --hard "origin/$BASE_BRANCH"
            node scripts/merge-fuel-history.mjs src/data/fuel-price-history.json /tmp/fuel-price-history.json
            cp /tmp/fuel-prices.json src/data/fuel-prices.json
            git add src/data/fuel-prices.json src/data/fuel-price-history.json
            git commit -m "$COMMIT_MESSAGE" || exit 0
          done
          # Backup copy on a branch nobody edits by hand. If a manual upload overwrites the history
          # file on the default branch, the next run merges it back from here.
          tmp="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin fuel-data >/dev/null; then
            git fetch --no-tags origin "+refs/heads/fuel-data:refs/remotes/origin/fuel-data"
            git worktree add -B fuel-data "$tmp" origin/fuel-data
          else
            git worktree add --detach "$tmp"
            git -C "$tmp" switch --orphan fuel-data
          fi
          cp /tmp/fuel-prices.json "$tmp/fuel-prices.json"
          cp src/data/fuel-price-history.json "$tmp/fuel-price-history.json"
          git -C "$tmp" add fuel-prices.json fuel-price-history.json
          git -C "$tmp" commit -m "$COMMIT_MESSAGE" || true
          git -C "$tmp" push origin "HEAD:refs/heads/fuel-data"

      - name: Verify both scheduled providers refreshed
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('src/data/fuel-prices.json','utf8')); const bad=['es','us'].filter(id=>d[id]?.status!=='fresh'); if(bad.length){console.error('Not fresh:',bad.join(', ')); process.exitCode=1}else console.log('Spain and US both fresh')"
